<p-dialog
  header="Novo Modpack"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '24rem' }"
  [closable]="true"
>
  <div class="py-2">
    <form [formGroup]="modpackForm" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        @if (directoryHandle()) {
          <label class="text-sm font-medium text-slate-700">Pasta *</label>
          <div
            class="flex items-center gap-2 px-3 py-2 rounded-md bg-emerald-50 border border-emerald-200"
          >
            <i class="pi pi-folder-open text-emerald-600"></i>
            <span
              class="text-sm text-emerald-700 font-medium flex-1 truncate"
              >{{ directoryHandle()?.name }}</span
            >
            <button
              type="button"
              class="text-slate-400 hover:text-slate-600 cursor-pointer"
              (click)="resetDirectory()"
            >
              <i class="pi pi-times text-xs"></i>
            </button>
          </div>
        } @else {
          <div
            (click)="pickFolder()"
            class="py-10 cursor-pointer border flex flex-col items-center gap-2 rounded-md border-dashed border-slate-300 p-4 text-slate-500 hover:border-slate-400"
            [class.opacity-50]="pickingFolder()"
            [class.pointer-events-none]="pickingFolder()"
          >
            <i class="pi pi-folder-open text-3xl"></i>
            <span class="text-sm">
              {{
                pickingFolder()
                  ? "Selecionando..."
                  : "Selecione a pasta do modpack"
              }}
            </span>
          </div>
        }
      </div>
      @if (directoryHandle()) {
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-slate-700">Nome *</label>
          <input
            pInputText
            formControlName="name"
            placeholder="Ex: Graviola Pack"
            class="w-full"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-slate-700">Versão *</label>
          <p-select
            formControlName="version"
            [options]="minecraftVersions"
            optionLabel="label"
            optionValue="value"
            optionDisabled="disabled"
            placeholder="Selecione a versão"
            [filter]="true"
            filterPlaceholder="Buscar versão"
            appendTo="body"
            class="w-full"
          />
        </div>
      }
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancelar"
        severity="secondary"
        [text]="true"
        (onClick)="visible.set(false)"
      />
      <p-button
        [label]="saving() ? 'Salvando...' : 'Criar'"
        icon="pi pi-plus"
        [loading]="saving()"
        [disabled]="
          !modpackForm.get('name')?.value?.trim() ||
          !modpackForm.get('version')?.value?.trim() ||
          !directoryHandle()
        "
        (onClick)="save()"
      />
    </div>
  </ng-template>
</p-dialog>

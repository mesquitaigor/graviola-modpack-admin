<p-dialog
  header="Editar modpack"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '24rem' }"
  [closable]="true"
>
  <div class="flex flex-col gap-4 py-2">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-slate-700">Nome *</label>
      <input
        pInputText
        [(ngModel)]="name"
        placeholder="Ex: Graviola Pack"
        class="w-full"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-slate-700">Versão *</label>
      <p-select
        [(ngModel)]="version"
        [options]="minecraftVersions"
        optionLabel="label"
        optionValue="value"
        optionDisabled="disabled"
        placeholder="Selecione a versão"
        [filter]="true"
        filterPlaceholder="Buscar versão"
        appendTo="body"
        class="w-full"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancelar"
        severity="secondary"
        [text]="true"
        (onClick)="visible = false"
      />
      <p-button
        label="Salvar"
        icon="pi pi-check"
        [loading]="saving"
        [disabled]="!name.trim() || !version.trim()"
        (onClick)="save()"
      />
    </div>
  </ng-template>
</p-dialog>

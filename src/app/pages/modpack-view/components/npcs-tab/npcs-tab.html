<app-add-npc-dialog
  #addNpcDialog
  [directoryHandle]="modpack().directoryHandle"
  (npcSelected)="onNpcSelected($event)"
/>
<div class="py-4">
  <div class="flex items-center justify-between">
    <h4 class="text-lg font-semibold text-platinum-700">
      NPCs adicionados
    </h4>
    <p-button
      size="small"
      icon="pi pi-plus"
      label="Adicionar NPC"
      (onClick)="addDialog()"
    ></p-button>
  </div>
  <hr class="my-3 border-platinum-100" />
  @if (addedNpcs().length) {
    <div class="flex flex-col gap-3">
      @for (npc of addedNpcs(); track npc.saveName + ':' + npc.name) {
        <div class="cursor-pointer flex gap-2 items-center pb-2">
          <div
            class="w-8 h-8 flex items-center justify-center rounded bg-seagrass-400"
          >
            <i class="pi pi-user text-white text-sm"></i>
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-semibold text-platinum-700">{{
              npc.name
            }}</span>
            @if (npc.saveName) {
              <span class="text-xs text-platinum-400">{{ npc.saveName }}</span>
            }
          </div>
        </div>
      }
    </div>
  } @else {
    <p class="text-sm text-platinum-400">
      Nenhum NPC adicionado ainda.
    </p>
  }
</div>

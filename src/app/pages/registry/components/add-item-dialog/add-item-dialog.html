<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  header="Adicionar item"
>
  <div class="space-y-4">
    <label for="itemId">ID do item</label>
    <input
      id="itemId"
      pInputText
      placeholder="Digite o ID do item"
      class="w-full"
    />
  </div>
  <div class="flex items-center justify-end gap-3 mt-4">
    <p-button
      severity="secondary"
      (click)="visibleChange.emit(false)"
      label="Cancelar"
    ></p-button>
    <p-button label="Adicionar"></p-button>
  </div>
</p-dialog>

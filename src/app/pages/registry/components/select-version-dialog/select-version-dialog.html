@if (versions().length > 3) {
  <div class="mb-4">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        placeholder="Buscar versão..."
        class="w-full"
      />
    </p-iconfield>
  </div>
}

<div class="flex flex-col gap-3 overflow-y-auto pr-1" style="max-height: 18rem">
  @for (group of filteredGroups(); track group.mcVersion) {
    <div>
      <p
        class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 px-1"
      >
        MC {{ group.mcVersion }}
      </p>
      <div class="flex flex-col gap-1">
        @for (item of group.items; track item.index) {
          <button
            type="button"
            class="flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-colors text-left w-full cursor-pointer"
            [class]="
              item.index === selectedVersionIndex()
                ? 'border-emerald-400 bg-emerald-50 text-emerald-800 font-semibold'
                : 'border-slate-200 bg-white text-slate-700 hover:border-emerald-300 hover:bg-emerald-50'
            "
            (click)="selectVersion(item.index)"
          >
            <span class="font-mono">v{{ item.value }}</span>
            @if (item.index === selectedVersionIndex()) {
              <i class="pi pi-check text-xs ml-auto text-emerald-600"></i>
            }
          </button>
        }
      </div>
    </div>
  } @empty {
    <p class="text-sm text-slate-400 text-center py-6">
      @if (searchQuery()) {
        Nenhuma versão encontrada para "{{ searchQuery() }}"
      } @else {
        Nenhuma versão cadastrada.
      }
    </p>
  }
</div>

<div class="mt-4">
  <p-button
    icon="pi pi-plus"
    label="Adicionar versão"
    [outlined]="true"
    [fluid]="true"
    size="small"
    (onClick)="requestAdd()"
  />
</div>

<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(96vw, 42rem)' }"
  header="Carregar arquivos de lang"
>
  <div class="space-y-4">
    <div>
      <label
        for="registry-item-lang"
        class="block text-sm font-medium text-slate-700 mb-2"
      >
        Selecione a pasta ou arquivos JSON de lang
      </label>
      <input
        id="registry-item-lang"
        type="file"
        multiple
        webkitdirectory
        accept=".json,application/json"
        class="block w-full text-sm text-slate-600 file:mr-3 file:px-3 file:py-2 file:rounded-md file:border-0 file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"
        (change)="onFilesSelected($event)"
      />
      <p class="text-xs text-slate-400 mt-2">
        Exemplo esperado: assets/modid/lang/pt_br.json com chaves de traducao.
      </p>
    </div>

    @if (importInProgress) {
      <p class="text-xs text-slate-500">Importando arquivos de lang...</p>
    }
    @if (importSummary) {
      <p class="text-xs text-slate-600">{{ importSummary }}</p>
    }
  </div>
</p-dialog>
